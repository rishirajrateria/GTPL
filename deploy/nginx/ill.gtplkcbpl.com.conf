# GTPL KCBPL leased line site -> ill.gtplkcbpl.com
# 1. Copy to /etc/nginx/sites-available/ill.gtplkcbpl.com.conf
# 2. ln -s /etc/nginx/sites-available/ill.gtplkcbpl.com.conf /etc/nginx/sites-enabled/
# 3. nginx -t && systemctl reload nginx
# 4. certbot --nginx -d ill.gtplkcbpl.com --redirect   (adds HTTPS + the http->https redirect)

server {
    listen 80;
    listen [::]:80;
    server_name ill.gtplkcbpl.com;

    root  /var/www/ill.gtplkcbpl.com;
    index index.html;
    charset utf-8;

    # Single page: anything unknown is a 404, never a directory listing.
    location / {
        try_files $uri $uri/ =404;
    }

    # The page itself always revalidates, so edits show up immediately.
    location = /index.html { expires -1; }
    location = /           { expires -1; }

    # Lead form, visitor activity and the /admin dashboard are handled by ill-backend
    # (server/ill_backend.py, a small Python service on 127.0.0.1:8787).
    # "^~" makes these win over the regex rules below.
    location ^~ /api/ {
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        access_log off;
    }
    location ^~ /admin {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
    }

    # Never serve repository or data files, even if someone copies the whole repo here.
    # (Regex locations match in order, so these must stay above the caching rule.)
    location ~ /\.(?!well-known/)                      { return 404; }
    location ~ ^/(data|deploy|logos)(/|$)              { return 404; }
    location ~* \.(xlsx|xls|csv|py|md|json|conf|zip)$  { return 404; }

    # Static extras can be cached for a week.
    location ~* \.(svg|jpg|png|ico)$ { expires 7d; }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # After HTTPS works, uncomment to make browsers always use HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
