# GTPL KCBPL leased line site -> ill.gtplkcbpl.com
# 1. a2enmod headers deflate expires proxy proxy_http
# 2. Copy to /etc/apache2/sites-available/ill.gtplkcbpl.com.conf
# 3. a2ensite ill.gtplkcbpl.com && apachectl configtest && systemctl reload apache2
# 4. certbot --apache -d ill.gtplkcbpl.com --redirect   (adds HTTPS + the http->https redirect)

<VirtualHost *:80>
    ServerName ill.gtplkcbpl.com
    DocumentRoot /var/www/ill.gtplkcbpl.com
    DirectoryIndex index.html
    AddDefaultCharset UTF-8

    <Directory /var/www/ill.gtplkcbpl.com>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Lead form, visitor activity and the /admin dashboard are handled by ill-backend
    # (server/ill_backend.py, a small Python service on 127.0.0.1:8787).
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        /api/  http://127.0.0.1:8787/api/
    ProxyPassReverse /api/  http://127.0.0.1:8787/api/
    ProxyPass        /admin http://127.0.0.1:8787/admin
    ProxyPassReverse /admin http://127.0.0.1:8787/admin
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    RequestHeader unset X-Forwarded-Host
    <LocationMatch "^/api/">
        LimitRequestBody 32768
    </LocationMatch>

    # Never serve repository or data files, even if someone copies the whole repo here.
    <LocationMatch "^/(data|deploy|logos)(/|$)">
        Require all denied
    </LocationMatch>
    <FilesMatch "\.(xlsx|xls|csv|py|md|json|conf|zip)$">
        Require all denied
    </FilesMatch>
    # Any path segment starting with a dot (.git, .env ...), except the certificate challenge folder.
    <LocationMatch "/\.(?!well-known/)">
        Require all denied
    </LocationMatch>

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/html "access plus 0 seconds"
        ExpiresByType image/svg+xml "access plus 7 days"
        ExpiresByType image/jpeg "access plus 7 days"
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript application/xml image/svg+xml
    </IfModule>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
        # After HTTPS works, uncomment to make browsers always use HTTPS:
        # Header always set Strict-Transport-Security "max-age=31536000"
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/ill.gtplkcbpl.com-error.log
    CustomLog ${APACHE_LOG_DIR}/ill.gtplkcbpl.com-access.log combined
</VirtualHost>
